name = "sofia-og"
main = "src/index.ts"
compatibility_date = "2025-01-15"

# No bindings required for the v1 worker — CF edge cache handles
# everything. Future iterations could mount a KV namespace for
# pre-warmed previews of high-traffic URLs.

[observability]
enabled = true

# Optional custom domain. Recommended once the worker is stable so the
# explorer can hard-code `VITE_OG_PROXY_URL=https://og.sofia.xyz` and
# stop depending on the `*.workers.dev` subdomain.
# [[routes]]
# pattern = "og.sofia.xyz/*"
# custom_domain = true
