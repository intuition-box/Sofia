services:
  sofia:
    # En prod sur Phala : maximesaintjoannis/sofia-mastra:vX.Y.Z (push via
    # le workflow CI). En local pour tester l'image fraîchement buildée :
    # docker build -f Dockerfile -t sofia-mastra:test . puis IMAGE=sofia-mastra:test
    image: ${IMAGE:-maximesaintjoannis/sofia-mastra:v1.5.0}
    container_name: sofia
    environment:
      # GaiaNet configuration
      - GAIANET_NODE_URL=${GAIANET_NODE_URL}
      - GAIANET_MODEL=${GAIANET_MODEL}
      - GAIANET_TEXT_MODEL_SMALL=${GAIANET_TEXT_MODEL_SMALL}
      - GAIANET_TEXT_MODEL_LARGE=${GAIANET_TEXT_MODEL_LARGE}
      - GAIANET_EMBEDDING_MODEL=${GAIANET_EMBEDDING_MODEL}
      - GAIANET_EMBEDDING_URL=${GAIANET_EMBEDDING_URL}
      - USE_EMBEDDINGS=${USE_EMBEDDINGS:-true}

      # Database (LibSQL file for persistence on DStack encrypted volume)
      - DATABASE_URL=file:/dstack/data/mastra.db

      # MCP Server — points to an external instance (Coolify) when the
      # chatbot is wired up. Leave empty for now: the chatbot agent
      # tolerates MCP being unreachable and boots without tools.
      - MCP_SERVER_URL=${MCP_SERVER_URL:-}

      # Server configuration
      - NODE_ENV=${NODE_ENV:-production}

      # OAuth token storage (AES-256-GCM, 32 bytes hex — REQUIRED to
      # enable the encrypted oauth_tokens table)
      - TOKEN_ENCRYPTION_KEY=${TOKEN_ENCRYPTION_KEY}

      # Human Attestor Bot (Proof of Human onchain attestations)
      - BOT_PRIVATE_KEY=${BOT_PRIVATE_KEY}
      - TWITCH_CLIENT_ID=${TWITCH_CLIENT_ID}
    ports:
      - '4111:4111'
    restart: always
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:4111/api/health']
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
