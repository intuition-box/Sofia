<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sofia Pro — Knowledge base</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Display: Poppins SemiBold. Body: Hind Regular. Mono: JetBrains Mono (URLs). -->
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700&family=Hind:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,500,0,0&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <script>
      // Dark by default; honour a saved 'light' preference (the in-app toggle)
      // before first paint to avoid a flash of the wrong theme.
      if (localStorage.getItem('sofia-theme') !== 'light') {
        document.documentElement.classList.add('dark')
      }
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
