  <body>
    <script>
      // Theme init before first paint (anti-FOUC). Reads the persisted
      // preference; defaults to dark. Mirror of hooks/useTheme.ts.
      ;(function () {
        try {
          var t = localStorage.getItem('sofia-theme') || 'dark'
          document.documentElement.setAttribute('data-theme', t)
          if (t === 'dark') document.documentElement.classList.add('dark')
        } catch (e) {
          document.documentElement.classList.add('dark')
        }
      })()
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
