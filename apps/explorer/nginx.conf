# Sofia Explorer — nginx config for Coolify.
# SPA fallback (React Router) + aggressive cache for hashed assets.

server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # Hashed assets get an immutable 1-year cache. Vite outputs them under
  # /assets/ with content-hashed filenames, so safe to cache forever.
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }

  # Static files (favicons, og images...) — short cache, revalidate.
  location ~* \.(png|jpg|jpeg|gif|svg|webp|ico|woff2?)$ {
    expires 7d;
    add_header Cache-Control "public, max-age=604800";
    try_files $uri =404;
  }

  # MCP Trust Engine reverse-proxy.
  #
  # The browser hits this same-origin path; nginx relays it server-side to
  # the trust engine. This mirrors the Vite dev proxy (vite.config.ts) so
  # dev and prod behave identically. A DIRECT cross-origin browser fetch to
  # mcp-trust.intuition.box fails: the upstream does not send
  # `Access-Control-Expose-Headers: mcp-session-id`, so the MCP session id is
  # invisible to JS and no session is ever established → every score is 0.
  # Going through nginx keeps it same-origin, so all headers survive.
  #
  # The trailing slash on both location and proxy_pass strips the
  # `/mcp-trust` prefix: /mcp-trust/mcp → https://mcp-trust.intuition.box/mcp.
  location /mcp-trust/ {
    proxy_pass https://mcp-trust.intuition.box/;
    proxy_http_version 1.1;
    proxy_set_header Host mcp-trust.intuition.box;
    proxy_ssl_server_name on;

    # MCP streams SSE (text/event-stream) and a cold compute_composite_score
    # pass can take ~25-45s. Disable buffering so events flush immediately and
    # raise the read timeout so the cold pass isn't cut off.
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 120s;
    proxy_send_timeout 120s;
  }

  # SPA fallback — every non-asset URL serves index.html so React Router
  # handles client-side routes.
  location / {
    try_files $uri $uri/ /index.html;
  }

  # Don't ever cache the entry HTML — we want users to pick up new
  # bundle hashes after a deploy.
  location = /index.html {
    add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate";
    add_header Pragma "no-cache";
    expires 0;
  }

  # Security hardening.
  add_header X-Frame-Options "SAMEORIGIN" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Permissions-Policy "geolocation=(), microphone=(), camera=(), payment=()" always;

  # Content Security Policy.
  #
  # `script-src` is intentionally relaxed with 'unsafe-inline' to keep the
  # theme bootstrap <script> in index.html working without a build-time
  # hash/nonce step. Migrate to a strict nonce when the theme script is
  # extracted to /assets/.
  #
  # `connect-src` whitelists the indexer, RPC, Privy, the Phala dstack
  # Mastra endpoints, and the explorer's own MCP. Adjust if you add a new
  # backend.
  #
  # `frame-ancestors 'self'` is the modern equivalent of
  # X-Frame-Options: SAMEORIGIN — kept alongside for older browsers.
  add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' data: https://fonts.gstatic.com; img-src 'self' data: https:; connect-src 'self' https://*.intuition.sh wss://*.intuition.sh https://rpc.intuition.systems wss://rpc.intuition.systems https://*.intuition.box wss://*.intuition.box https://*.privy.io wss://*.privy.io https://*.dstack-pha-prod7.phala.network wss://*.dstack-pha-prod7.phala.network https://*.walletconnect.org https://*.walletconnect.com wss://*.walletconnect.org wss://*.walletconnect.com; frame-src 'self' https://*.privy.io https://verify.walletconnect.com https://verify.walletconnect.org; frame-ancestors 'self'; object-src 'none'; base-uri 'self'; form-action 'self'" always;

  # Health endpoint for Coolify / load balancer probes.
  location = /healthz {
    access_log off;
    return 200 "ok\n";
    add_header Content-Type text/plain;
  }

  # gzip text resources — nginx defaults are too narrow.
  gzip on;
  gzip_vary on;
  gzip_min_length 1024;
  gzip_types
    application/javascript
    application/json
    application/xml
    text/css
    text/plain
    text/xml
    image/svg+xml;
}
