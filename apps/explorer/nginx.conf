# Sofia Explorer — nginx config for Coolify.
# SPA fallback (React Router) + aggressive cache for hashed assets.

server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # Hashed assets get an immutable 1-year cache. Vite outputs them under
  # /assets/ with content-hashed filenames, so safe to cache forever.
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }

  # Static files (favicons, og images...) — short cache, revalidate.
  location ~* \.(png|jpg|jpeg|gif|svg|webp|ico|woff2?)$ {
    expires 7d;
    add_header Cache-Control "public, max-age=604800";
    try_files $uri =404;
  }

  # SPA fallback — every non-asset URL serves index.html so React Router
  # handles client-side routes.
  location / {
    try_files $uri $uri/ /index.html;
  }

  # Don't ever cache the entry HTML — we want users to pick up new
  # bundle hashes after a deploy.
  location = /index.html {
    add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate";
    add_header Pragma "no-cache";
    expires 0;
  }

  # Security hardening.
  add_header X-Frame-Options "SAMEORIGIN" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;

  # Health endpoint for Coolify / load balancer probes.
  location = /healthz {
    access_log off;
    return 200 "ok\n";
    add_header Content-Type text/plain;
  }

  # gzip text resources — nginx defaults are too narrow.
  gzip on;
  gzip_vary on;
  gzip_min_length 1024;
  gzip_types
    application/javascript
    application/json
    application/xml
    text/css
    text/plain
    text/xml
    image/svg+xml;
}
