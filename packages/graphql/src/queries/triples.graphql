# Main pagination query
query GetTriples(
  $limit: Int
  $offset: Int
  $orderBy: [triples_order_by!]
  $where: triples_bool_exp
) {
  total: triples_aggregate(where: $where) {
    aggregate {
      count
    }
  }
  triples(limit: $limit, offset: $offset, order_by: $orderBy, where: $where) {
    ...TripleMetadata
    ...TripleTxn
    ...TripleVaultDetails
    creator {
      ...AccountMetadata
    }
  }
}

# Combined query with aggregates and nodes
query GetTriplesWithAggregates(
  $limit: Int
  $offset: Int
  $orderBy: [triples_order_by!]
  $where: triples_bool_exp
) {
  triples_aggregate(
    limit: $limit
    offset: $offset
    order_by: $orderBy
    where: $where
  ) {
    aggregate {
      count
    }
    nodes {
      ...TripleMetadata
      ...TripleTxn
      ...TripleVaultDetails
      creator {
        ...AccountMetadata
      }
    }
  }
}

query GetTriplesCount($where: triples_bool_exp) {
  triples_aggregate(where: $where) {
    total: aggregate {
      count
    }
  }
}

query GetTriple($tripleId: String!) {
  triple(term_id: $tripleId) {
    ...TripleMetadata
    ...TripleTxn
    ...TripleVaultDetails
    creator {
      ...AccountMetadata
    }
  }
}

query GetAtomTriplesWithPositions($where: triples_bool_exp) {
  triples_aggregate(where: $where) {
    aggregate {
      count
    }
  }
}

query GetTriplesWithPositions(
  $limit: Int
  $offset: Int
  $orderBy: [triples_order_by!]
  $where: triples_bool_exp
  $addresses: [String!]
) {
  total: triples_aggregate(where: $where) {
    aggregate {
      count
    }
  }
  triples(limit: $limit, offset: $offset, order_by: $orderBy, where: $where) {
    term_id
    counter_term_id
    subject {
      term_id
      label
      image
    }
    predicate {
      term_id
      label
      image
    }
    object {
      term_id
      label
      image
    }
    term {
      vaults {
        total_shares
        position_count
        positions(where: { account_id: { _in: $addresses } }) {
          account {
            id
            label
            image
          }
          shares
        }
      }
    }
    counter_term {
      vaults {
        total_shares
        position_count
        positions(where: { account_id: { _in: $addresses } }) {
          account {
            id
            label
            image
          }
          shares
        }
      }
    }
  }
}

query FindTriples(
  $where: triples_bool_exp = {}
  $addresses: [String!]!
  $limit: Int = 100
) {
  triples(where: $where, limit: $limit) {
    term_id
    subject_id
    predicate_id
    object_id
    positions(where: { account_id: { _in: $addresses } }) {
      shares
    }
  }
}

query FindNestedTriples($where: triples_bool_exp = {}, $limit: Int = 100) {
  triples(where: $where, limit: $limit) {
    term_id
    subject_id
    predicate_id
    object_id
    positions(where: { shares: { _gt: "0" } }) {
      account_id
      shares
    }
  }
}

# Trust positions other users hold on the connected user's account atoms —
# aggregates position counts on every `(I, trusts, <accountAtom>)` triple's
# vaults. Drives the "Trusted" badge in the right-rail.
query GetTrustedByPositions(
  $subjectId: String!
  $predicateId: String!
  $objectIds: [String!]!
) {
  triples(
    where: {
      _and: [
        { subject_id: { _eq: $subjectId } }
        { predicate_id: { _eq: $predicateId } }
        { object_id: { _in: $objectIds } }
      ]
    }
  ) {
    term {
      vaults {
        positions_aggregate(where: { shares: { _gt: "0" } }) {
          aggregate {
            count
          }
        }
      }
    }
  }
}

# Cert triples certified "in context of" a given topic — step 1 resolves the
# context triples to subject (cert) ids; step 2 (GetCertTriples) resolves
# platform details for those certs.
query GetTopicContextTriples($topicTermId: String!) {
  triples(
    where: {
      predicate: { label: { _eq: "in context of" } }
      object: { term_id: { _eq: $topicTermId } }
    }
    limit: 200
  ) {
    subject_id
  }
}

# Resolve cert triple details (platform label/url/image, vault stats and the
# viewer's own positions) for a set of cert term ids.
query GetCertTriples($termIds: [String!]!, $address: String) {
  triples(where: { term_id: { _in: $termIds } }) {
    term_id
    predicate {
      label
    }
    object {
      label
      image
      value {
        thing {
          url
          name
        }
      }
    }
    term {
      vaults {
        position_count
        market_cap
        positions(where: { account_id: { _ilike: $address } }) {
          shares
        }
      }
    }
  }
}
