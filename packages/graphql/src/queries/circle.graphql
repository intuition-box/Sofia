query GetTrustCirclePositions(
  $subjectId: String!
  $predicateId: String!
  $addresses: [String!]!
  $offset: Int
  $positionsOrderBy: [positions_order_by!]
) {
  triples_aggregate(
    where: {
      _and: [
        { subject_id: { _eq: $subjectId } }
        { predicate_id: { _eq: $predicateId } }
        { positions: { account_id: { _in: $addresses } } }
      ]
    }
  ) {
    aggregate {
      count
    }
  }
  triples(
    offset: $offset
    where: {
      _and: [
        { subject_id: { _eq: $subjectId } }
        { predicate_id: { _eq: $predicateId } }
        { object: { type: { _eq: "Account" } } }
        { positions: { account_id: { _in: $addresses } } }
      ]
    }
  ) {
    term_id
    subject {
      label
    }
    predicate {
      label
    }
    object {
      term_id
      label
      type
      accounts {
        id
        label
        image
      }
    }
    term {
      vaults(where: { curve_id: { _eq: "1" } }) {
        total_shares
        current_share_price
        positions_aggregate {
          aggregate {
            count
            sum {
              shares
            }
          }
        }
        positions(
          where: { account_id: { _in: $addresses } }
          order_by: $positionsOrderBy
        ) {
          account_id
          account {
            id
            label
          }
          shares
        }
      }
    }
  }
}

query GetTrustCircleAccounts(
  $subjectId: String!
  $predicateId: String!
  $walletAddresses: [String!]!
) {
  triples(
    where: {
      _and: [
        { subject_id: { _eq: $subjectId } }
        { predicate_id: { _eq: $predicateId } }
        { object: { type: { _eq: "Account" } } }
      ]
    }
  ) {
    object {
      term_id
      label
      type
      accounts {
        id
        label
        image
      }
    }
    term {
      vaults(where: { curve_id: { _eq: "2" } }, order_by: { curve_id: asc }) {
        positions(where: { account_id: { _in: $walletAddresses } }) {
          account_id
          shares
        }
      }
    }
  }
}

query GetCircleFeed($address: String!) {
  positions_from_following(
    args: { address: $address }
    order_by: { created_at: desc }
    limit: 50
    where: {
      vault: { term: { triple: { predicate_id: { _is_null: false } } } }
    }
  ) {
    id
    created_at
    account {
      id
      label
    }
    vault {
      term {
        triple {
          term_id
          object {
            label
            value {
              thing {
                url
                name
                image
              }
            }
          }
          predicate {
            term_id
            label
          }
          subject {
            label
            term_id
          }
        }
      }
    }
  }
}

query GetFollowingCount($address: String!) {
  following_aggregate(args: { address: $address }) {
    aggregate {
      count
    }
  }
}

# Step 1 of the alltime per-topic count: every cert triple where one of
# the given accounts holds shares > 0. Filtering by `positions` (instead
# of `subject.value.account.id`) is the right path for Sofia certs —
# the triple subject is a generic "I" atom shared across users, whereas
# positions carry the actual holder account.
query GetCircleCerts($trustedWallets: [String!]!, $limit: Int = 50000) {
  triples(
    where: {
      positions: { account_id: { _in: $trustedWallets }, shares: { _gt: "0" } }
    }
    limit: $limit
  ) {
    term_id
  }
}

# Step 2: "in context of" links from those cert term_ids to topic atoms.
# One row per (cert, topic); callers bucket by `object_id` to get the
# per-topic count.
query GetCertTopicLinks(
  $certTermIds: [String!]!
  $topicAtomIds: [String!]!
  $limit: Int = 50000
) {
  triples(
    where: {
      predicate: { label: { _eq: "in context of" } }
      subject_id: { _in: $certTermIds }
      object_id: { _in: $topicAtomIds }
    }
    limit: $limit
  ) {
    subject_id
    object_id
  }
}

# Master query for the on-chain profile: every cert triple where the user
# holds shares > 0, paginated. Returns enough metadata to drive the
# calendar (timestamp + topic), the radar (intention + topic), the
# discovery badges (positions_aggregate count = certifier total), the
# top platforms / claims (object label + url), and the per-topic score.
query GetUserCertsAlltime(
  $userAddresses: [String!]!
  $predicateLabels: [String!]!
  $limit: Int!
  $offset: Int!
) {
  triples(
    where: {
      predicate: { label: { _in: $predicateLabels } }
      positions: { account_id: { _in: $userAddresses }, shares: { _gt: "0" } }
    }
    limit: $limit
    offset: $offset
    order_by: { term_id: asc }
  ) {
    term_id
    counter_term_id
    predicate {
      term_id
      label
    }
    object {
      term_id
      label
      value {
        thing {
          url
          name
        }
      }
    }
    positions_aggregate(where: { shares: { _gt: "0" } }) {
      aggregate {
        count
      }
    }
    positions(
      where: { account_id: { _in: $userAddresses }, shares: { _gt: "0" } }
    ) {
      account_id
      shares
      created_at
    }
  }
}

query GetSofiaTrustedActivity(
  $trustedWallets: [String!]!
  $proxy: String!
  $userAddresses: [String!] = []
  $limit: Int!
  $offset: Int!
) {
  events(
    limit: $limit
    offset: $offset
    order_by: { created_at: desc }
    where: {
      _and: [
        { type: { _neq: "FeesTransfered" } }
        {
          _or: [
            {
              _and: [
                { type: { _eq: "Deposited" } }
                { deposit: { sender_id: { _eq: $proxy } } }
                { deposit: { receiver: { id: { _in: $trustedWallets } } } }
                { deposit: { assets_after_fees: { _neq: "0" } } }
              ]
            }
            {
              _and: [
                { type: { _eq: "Redeemed" } }
                { redemption: { sender_id: { _in: $trustedWallets } } }
                {
                  _or: [
                    {
                      _and: [
                        { triple_id: { _is_null: false } }
                        { triple: { creator: { id: { _eq: $proxy } } } }
                      ]
                    }
                    {
                      _and: [
                        { atom_id: { _is_null: false } }
                        { atom: { creator: { id: { _eq: $proxy } } } }
                      ]
                    }
                  ]
                }
              ]
            }
          ]
        }
      ]
    }
  ) {
    id
    type
    created_at
    transaction_hash

    deposit {
      sender_id
      assets_after_fees
      shares
      sender {
        id
        label
        image
      }
      receiver {
        id
        label
        image
      }
    }

    redemption {
      sender_id
      assets
      shares
      sender {
        id
        label
        image
      }
    }

    atom {
      term_id
      label
      type
      creator {
        id
        label
        image
      }
    }

    triple {
      term_id
      counter_term_id
      creator {
        id
        label
        image
      }
      subject {
        label
        term_id
      }
      predicate {
        label
        term_id
      }
      object {
        label
        term_id
        value {
          thing {
            url
          }
        }
      }
      term {
        vaults {
          position_count
          positions(where: { account_id: { _in: $userAddresses } }) {
            shares
          }
        }
      }
      counter_term {
        vaults {
          position_count
          positions(where: { account_id: { _in: $userAddresses } }) {
            shares
          }
        }
      }
    }
  }
}

query FindUserPositionsOnTriples(
  $termIds: [String!]!
  $addresses: [String!]!
  $limit: Int = 500
) {
  triples(where: { term_id: { _in: $termIds } }, limit: $limit) {
    term_id
    counter_term_id
    positions(where: { account_id: { _in: $addresses } }) {
      shares
    }
    counter_term {
      vaults(where: { curve_id: { _eq: "1" } }) {
        positions(where: { account_id: { _in: $addresses } }) {
          shares
        }
      }
    }
  }
}
