query GetTrustCirclePositions(
  $subjectId: String!
  $predicateId: String!
  $addresses: [String!]!
  $offset: Int
  $positionsOrderBy: [positions_order_by!]
) {
  triples_aggregate(
    where: {
      _and: [
        { subject_id: { _eq: $subjectId } }
        { predicate_id: { _eq: $predicateId } }
        { positions: { account_id: { _in: $addresses } } }
      ]
    }
  ) {
    aggregate {
      count
    }
  }
  triples(
    offset: $offset
    where: {
      _and: [
        { subject_id: { _eq: $subjectId } }
        { predicate_id: { _eq: $predicateId } }
        { object: { type: { _eq: "Account" } } }
        { positions: { account_id: { _in: $addresses } } }
      ]
    }
  ) {
    term_id
    subject {
      label
    }
    predicate {
      label
    }
    object {
      term_id
      label
      type
      accounts {
        id
        label
        image
      }
    }
    term {
      vaults(where: { curve_id: { _eq: "1" } }) {
        total_shares
        current_share_price
        positions_aggregate {
          aggregate {
            count
            sum {
              shares
            }
          }
        }
        positions(
          where: { account_id: { _in: $addresses } }
          order_by: $positionsOrderBy
        ) {
          account_id
          account {
            id
            label
          }
          shares
        }
      }
    }
  }
}

query GetTrustCircleAccounts(
  $subjectId: String!
  $predicateId: String!
  $walletAddresses: [String!]!
) {
  triples(
    where: {
      _and: [
        { subject_id: { _eq: $subjectId } }
        { predicate_id: { _eq: $predicateId } }
        { object: { type: { _eq: "Account" } } }
      ]
    }
  ) {
    object {
      term_id
      label
      type
      accounts {
        id
        label
        image
      }
    }
    term {
      vaults(where: { curve_id: { _eq: "2" } }, order_by: { curve_id: asc }) {
        positions(where: { account_id: { _in: $walletAddresses } }) {
          account_id
          shares
        }
      }
    }
  }
}

query GetCircleFeed($address: String!) {
  positions_from_following(
    args: { address: $address }
    order_by: { created_at: desc }
    limit: 50
    where: {
      vault: { term: { triple: { predicate_id: { _is_null: false } } } }
    }
  ) {
    id
    created_at
    account {
      id
      label
    }
    vault {
      term {
        triple {
          term_id
          object {
            label
            value {
              thing {
                url
                name
                image
              }
            }
          }
          predicate {
            term_id
            label
          }
          subject {
            label
            term_id
          }
        }
      }
    }
  }
}

query GetFollowingCount($address: String!) {
  following_aggregate(args: { address: $address }) {
    aggregate {
      count
    }
  }
}

# Step 1 of the alltime per-topic count: every cert triple where one of
# the given accounts holds shares > 0. Filtering by `positions` (instead
# of `subject.value.account.id`) is the right path for Sofia certs —
# the triple subject is a generic "I" atom shared across users, whereas
# positions carry the actual holder account.
query GetCircleCerts($trustedWallets: [String!]!, $limit: Int = 50000) {
  triples(
    where: {
      positions: { account_id: { _in: $trustedWallets }, shares: { _gt: "0" } }
    }
    limit: $limit
  ) {
    term_id
  }
}

# Step 2: "in context of" links from those cert term_ids to topic atoms.
# One row per (cert, topic); callers bucket by `object_id` to get the
# per-topic count.
query GetCertTopicLinks(
  $certTermIds: [String!]!
  $topicAtomIds: [String!]!
  $limit: Int = 50000
) {
  triples(
    where: {
      predicate: { label: { _eq: "in context of" } }
      subject_id: { _in: $certTermIds }
      object_id: { _in: $topicAtomIds }
    }
    limit: $limit
  ) {
    subject_id
    object_id
  }
}

# Step 2b: same "in context of" nested triples, restricted to those the
# user actually staked on — with the user's earliest position timestamp.
# Drives "Tagged X with topic Y" rows in the ProfileDrawer activity feed.
# `positions` is filtered+ordered+limited to the user's first share so
# the row count stays bounded.
query GetUserContextAdditions(
  $userAddresses: [String!]!
  $certTermIds: [String!]!
  $topicAtomIds: [String!]!
  $limit: Int = 50000
) {
  triples(
    where: {
      predicate: { label: { _eq: "in context of" } }
      subject_id: { _in: $certTermIds }
      object_id: { _in: $topicAtomIds }
      positions: { account_id: { _in: $userAddresses }, shares: { _gt: "0" } }
    }
    limit: $limit
  ) {
    subject_id
    object_id
    positions(
      where: { account_id: { _in: $userAddresses }, shares: { _gt: "0" } }
      order_by: { created_at: asc }
      limit: 1
    ) {
      created_at
    }
  }
}

# Master query for the on-chain profile: every cert triple where the user
# holds shares > 0, paginated. Returns enough metadata to drive the
# calendar (timestamp + topic), the radar (intention + topic), the
# discovery badges (positions_aggregate count = certifier total), the
# top platforms / claims (object label + url), and the per-topic score.
query GetUserCertsAlltime(
  $userAddresses: [String!]!
  $predicateLabels: [String!]!
  $limit: Int!
  $offset: Int!
) {
  triples(
    where: {
      predicate: { label: { _in: $predicateLabels } }
      positions: { account_id: { _in: $userAddresses }, shares: { _gt: "0" } }
    }
    limit: $limit
    offset: $offset
    order_by: { term_id: asc }
  ) {
    term_id
    counter_term_id
    predicate {
      term_id
      label
    }
    object {
      term_id
      label
      value {
        thing {
          url
          name
        }
      }
    }
    positions_aggregate(where: { shares: { _gt: "0" } }) {
      aggregate {
        count
      }
    }
    positions(
      where: { account_id: { _in: $userAddresses }, shares: { _gt: "0" } }
    ) {
      account_id
      shares
      created_at
    }
  }
}

# Sofia global feed — every Sofia-labeled triple anyone has actively
# endorsed, all-time. Same shape as `GetSofiaCircleActivity` but
# without the trusted-wallet position filter, so it drives the /home
# All Activity feed (and any future "everyone on Sofia" surface)
# through the unified `useSofiaFeed` hook.
query GetSofiaGlobalFeed(
  $userAddresses: [String!] = []
  $predicateLabels: [String!]!
  $limit: Int!
  $offset: Int!
) {
  triples(
    where: {
      predicate: { label: { _in: $predicateLabels } }
      # At least one active position so we don't surface dead triples
      positions: { shares: { _gt: "0" } }
    }
    order_by: { created_at: desc }
    limit: $limit
    offset: $offset
  ) {
    term_id
    counter_term_id
    subject {
      ...AtomMetadata
    }
    predicate {
      term_id
      label
    }
    object {
      ...AtomMetadata
    }
    # Top recent endorser per triple — single row keyed by created_at
    # so the feed card has a certifier identity to render.
    recentPositions: positions(
      where: { shares: { _gt: "0" } }
      order_by: { created_at: desc }
      limit: 1
    ) {
      account_id
      created_at
      shares
      account {
        id
        label
        image
      }
    }
    term {
      vaults {
        position_count
        positions(where: { account_id: { _in: $userAddresses } }) {
          account_id
          shares
        }
      }
    }
    counter_term {
      vaults {
        position_count
        positions(where: { account_id: { _in: $userAddresses } }) {
          account_id
          shares
        }
      }
    }
  }
}

# Sofia circle activity — every Sofia-labeled triple any trusted
# wallet has actively endorsed, all-time.
#
# Mirrors the proven `GetUserCertsAlltime` pattern (Echoes): we
# filter triples by their predicate label (the 6 visits-for-* verbs
# + trusts + distrust) instead of trying to identify Sofia data via
# the proxy `creator` field — predicate labels are stable across
# proxy redeploys and never disappear after the cert.
#
# Each returned triple carries `trustedPositions` (one row per
# trust-circle member who staked on it) so the service can expand a
# single triple into N feed cards — one per (member, triple) pair.
# Vault counts come from `term.vaults` for the support/oppose
# tallies on the card and from `counter_term.vaults` for the oppose
# side.
query GetSofiaCircleActivity(
  $trustedWallets: [String!]!
  $userAddresses: [String!] = []
  $predicateLabels: [String!]!
  $limit: Int!
  $offset: Int!
) {
  triples(
    where: {
      predicate: { label: { _in: $predicateLabels } }
      positions: { account_id: { _in: $trustedWallets }, shares: { _gt: "0" } }
    }
    # Chronological — newest cert triples first. Matches the
    # `events.created_at: desc` ordering the old query used so page
    # 1 still reads "what just happened" rather than an arbitrary
    # term_id-hash sample (which misses the engagement heavy-hitters
    # on big trust circles).
    order_by: { created_at: desc }
    limit: $limit
    offset: $offset
  ) {
    term_id
    counter_term_id
    subject {
      ...AtomMetadata
    }
    predicate {
      term_id
      label
    }
    object {
      ...AtomMetadata
    }
    # Trust-circle positions on this triple — one row per certifier
    # member, carrying the timestamp the service uses to render the
    # "X ago" label on each feed card.
    trustedPositions: positions(
      where: { account_id: { _in: $trustedWallets }, shares: { _gt: "0" } }
    ) {
      account_id
      created_at
      shares
      account {
        id
        label
        image
      }
    }
    # Vaults on the positive term + the counter term — ALL curves
    # (not filtered to curve 1) so `position_count` matches the sum
    # the old events query was returning. Sofia certs split shares
    # across the linear (votes) and progressive (creation) curves;
    # filtering to one curve halved the support counts and made the
    # star rating + hot-picks fall apart.
    term {
      vaults {
        position_count
        positions(where: { account_id: { _in: $userAddresses } }) {
          account_id
          shares
        }
      }
    }
    counter_term {
      vaults {
        position_count
        positions(where: { account_id: { _in: $userAddresses } }) {
          account_id
          shares
        }
      }
    }
  }
}

# Aggregate stats for the /circles list card — total cert count,
# total endorsements, and distinct depositors in the last 7 days.
# Side-steps the paginated feed so the small "Posts / Votes / Live"
# tiles always show all-time numbers even when the user never
# scrolls past page 0 of the feed.
query GetSofiaCircleListStats(
  $trustedWallets: [String!]!
  $predicateLabels: [String!]!
  $sevenDaysAgo: timestamptz!
) {
  # Posts → distinct Sofia certs any trusted wallet still endorses.
  posts: triples_aggregate(
    where: {
      predicate: { label: { _in: $predicateLabels } }
      positions: { account_id: { _in: $trustedWallets }, shares: { _gt: "0" } }
    }
  ) {
    aggregate {
      count
    }
  }
  # Votes → total active endorsements (positions with shares > 0)
  # on those Sofia certs by the trusted wallets.
  votes: positions_aggregate(
    where: {
      account_id: { _in: $trustedWallets }
      shares: { _gt: "0" }
      term: { triple: { predicate: { label: { _in: $predicateLabels } } } }
    }
  ) {
    aggregate {
      count
    }
  }
  # Live · 7d → trusted positions created in the last 7 days. We
  # pull `account_id` so the caller dedupes client-side (the
  # indexer's `distinct_on` is not generally available on
  # positions_aggregate).
  recent: positions(
    where: {
      account_id: { _in: $trustedWallets }
      shares: { _gt: "0" }
      created_at: { _gte: $sevenDaysAgo }
      term: { triple: { predicate: { label: { _in: $predicateLabels } } } }
    }
  ) {
    account_id
  }
}

# Legacy events-based variant — kept until callers switch, then to
# be removed. Filters 200 most recent indexer events by Sofia proxy
# receiver, then post-processes. Suffers from a sparse hit-rate
# because the indexer-wide firehose is far larger than Sofia's
# activity.
query GetSofiaTrustedActivity(
  $trustedWallets: [String!]!
  $proxy: String!
  $userAddresses: [String!] = []
  $limit: Int!
  $offset: Int!
) {
  events(
    limit: $limit
    offset: $offset
    order_by: { created_at: desc }
    where: {
      _and: [
        { type: { _neq: "FeesTransfered" } }
        {
          _or: [
            {
              _and: [
                { type: { _eq: "Deposited" } }
                { deposit: { sender_id: { _eq: $proxy } } }
                { deposit: { receiver: { id: { _in: $trustedWallets } } } }
                { deposit: { assets_after_fees: { _neq: "0" } } }
              ]
            }
            {
              _and: [
                { type: { _eq: "Redeemed" } }
                { redemption: { sender_id: { _in: $trustedWallets } } }
                {
                  _or: [
                    {
                      _and: [
                        { triple_id: { _is_null: false } }
                        { triple: { creator: { id: { _eq: $proxy } } } }
                      ]
                    }
                    {
                      _and: [
                        { atom_id: { _is_null: false } }
                        { atom: { creator: { id: { _eq: $proxy } } } }
                      ]
                    }
                  ]
                }
              ]
            }
          ]
        }
      ]
    }
  ) {
    id
    type
    created_at
    transaction_hash

    deposit {
      sender_id
      assets_after_fees
      shares
      sender {
        id
        label
        image
      }
      receiver {
        id
        label
        image
      }
    }

    redemption {
      sender_id
      assets
      shares
      sender {
        id
        label
        image
      }
    }

    atom {
      term_id
      label
      type
      creator {
        id
        label
        image
      }
    }

    triple {
      term_id
      counter_term_id
      creator {
        id
        label
        image
      }
      subject {
        label
        term_id
      }
      predicate {
        label
        term_id
      }
      object {
        label
        term_id
        value {
          thing {
            url
          }
        }
      }
      term {
        vaults {
          position_count
          positions(where: { account_id: { _in: $userAddresses } }) {
            shares
          }
        }
      }
      counter_term {
        vaults {
          position_count
          positions(where: { account_id: { _in: $userAddresses } }) {
            shares
          }
        }
      }
    }
  }
}

query FindUserPositionsOnTriples(
  $termIds: [String!]!
  $addresses: [String!]!
  $limit: Int = 500
) {
  triples(where: { term_id: { _in: $termIds } }, limit: $limit) {
    term_id
    counter_term_id
    positions(where: { account_id: { _in: $addresses } }) {
      shares
    }
    counter_term {
      vaults(where: { curve_id: { _eq: "1" } }) {
        positions(where: { account_id: { _in: $addresses } }) {
          shares
        }
      }
    }
  }
}
