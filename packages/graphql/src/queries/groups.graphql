# Groups — `is member of` membership claims.
#
# Sofia model: anyone can mint a triple "X is member of Y". We list
# every such claim and aggregate by the object atom (the group) on the
# service side. Anti-spam filtering is intentionally out of scope here;
# it'll be enforced by an on-chain process in a future iteration.

# Paginated list of every `is_member_of` triple — service derives the
# group catalogue by bucketing the rows by `object.term_id`.
query GetGroupsList($predicateId: String!, $limit: Int!, $offset: Int!) {
  triples(
    where: { predicate_id: { _eq: $predicateId } }
    order_by: { created_at: desc }
    limit: $limit
    offset: $offset
  ) {
    term_id
    created_at
    subject {
      ...AtomMetadata
    }
    object {
      ...AtomMetadata
    }
  }
}

# All membership triples for one specific group atom — used by the
# group detail page to list every claimed member.
query GetGroupDetail(
  $predicateId: String!
  $objectId: String!
  $limit: Int!
  $offset: Int!
) {
  triples(
    where: {
      _and: [
        { predicate_id: { _eq: $predicateId } }
        { object_id: { _eq: $objectId } }
      ]
    }
    order_by: { created_at: desc }
    limit: $limit
    offset: $offset
  ) {
    term_id
    created_at
    subject {
      ...AtomMetadata
    }
    object {
      ...AtomMetadata
    }
  }
}
