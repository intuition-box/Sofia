# Certifications fetched per-circle for the Compose → Perspective pipeline.
#
# Returns every `visits_for_*` triple where at least one of the given wallets
# holds shares > 0 on the support vault. The query also carries both vaults'
# aggregate stats so the Contrast mode can rank URLs by the
# |support − oppose| signal gap across picks.
#
# `predicateLabels` is parameterised on purpose: callers pick which intention
# kinds are in scope (e.g. only Work + Learning, or every intention). Label-
# based filtering catches Music + Buying which were missing from the old
# id-based `PREDICATE_IDS` constant set. The topic filter is applied
# client-side using the existing `GetCertTopicLinks` query (see
# `circle.graphql`) so this query stays cheap and reusable.
query GetPerspectiveCerts(
  $wallets: [String!]!
  $predicateLabels: [String!]!
  $limit: Int = 1000
  $offset: Int = 0
) {
  triples(
    where: {
      predicate: { label: { _in: $predicateLabels } }
      positions: { account_id: { _in: $wallets }, shares: { _gt: "0" } }
    }
    limit: $limit
    offset: $offset
    order_by: { term_id: asc }
  ) {
    term_id
    counter_term_id
    created_at
    predicate {
      term_id
      label
    }
    object {
      term_id
      label
      image
      value {
        thing {
          url
          name
        }
      }
    }
    term {
      vaults(where: { curve_id: { _eq: "1" } }) {
        position_count
        total_shares
        market_cap
      }
    }
    counter_term {
      vaults(where: { curve_id: { _eq: "1" } }) {
        position_count
        total_shares
        market_cap
      }
    }
    positions(where: { account_id: { _in: $wallets }, shares: { _gt: "0" } }) {
      account_id
      shares
    }
  }
}

# Subset of cert term ids that have an "in context of" nested triple pointing
# to one of the given topic atom ids — applied client-side to narrow a circle's
# certs to the selected topics.
query CertsInTopics($certTermIds: [String!]!, $topicAtomIds: [String!]!) {
  triples(
    where: {
      predicate: { label: { _eq: "in context of" } }
      subject_id: { _in: $certTermIds }
      object_id: { _in: $topicAtomIds }
    }
    limit: 50000
  ) {
    subject_id
  }
}
