# Certifications fetched per-circle for the Compose → Perspective pipeline.
#
# Returns every `visits_for_*` triple where at least one of the given wallets
# holds shares > 0 on the support vault (curve 1 — linear). The query also
# carries both vaults' aggregate stats so the Contrast mode can rank URLs by
# the |support − oppose| signal gap across picks.
#
# `predicateIds` is parameterised on purpose: callers pick which intention
# kinds are in scope (e.g. only Work + Learning, or every intention). The
# topic filter is applied client-side using the existing `GetCertTopicLinks`
# query (see `circle.graphql`) so this query stays cheap and reusable.
query GetPerspectiveCerts(
  $wallets: [String!]!
  $predicateIds: [String!]!
  $limit: Int = 500
  $offset: Int = 0
) {
  triples(
    where: {
      predicate_id: { _in: $predicateIds }
      positions: { account_id: { _in: $wallets }, shares: { _gt: "0" } }
    }
    limit: $limit
    offset: $offset
    order_by: { term_id: asc }
  ) {
    term_id
    counter_term_id
    predicate {
      term_id
      label
    }
    object {
      term_id
      label
      image
      value {
        thing {
          url
          name
        }
      }
    }
    term {
      vaults(where: { curve_id: { _eq: "1" } }) {
        position_count
        total_shares
        market_cap
      }
    }
    counter_term {
      vaults(where: { curve_id: { _eq: "1" } }) {
        position_count
        total_shares
        market_cap
      }
    }
    positions(where: { account_id: { _in: $wallets }, shares: { _gt: "0" } }) {
      account_id
      shares
    }
  }
}
