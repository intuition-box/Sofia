# Market refocus — Trending + Positions pages (apps/explorer).
#
# Trending ranks pages (web atoms grouped by normalized URL / platform) by the
# positions opened on their claims inside a time window — Sofia page claims
# plus canonical support claims from any app — then backfills the details of
# the ranked pages one page of results at a time.

# Latest positions on Sofia page claims, newest first. The caller pages
# through and stops at its window cutoff: a `created_at: { _gte }` filter here
# makes the indexer scan instead of walking the created_at index (24s vs <1s
# on a quiet window). Rows on the counter term (oppose) also resolve
# `term.triple` — compare `term_id` to `triple.term_id` to keep support only.
query GetTrendingPagePositions(
  $predicateLabels: [String!]!
  $limit: Int!
  $offset: Int!
) {
  positions(
    where: {
      shares: { _gt: "0" }
      term: { triple: { predicate: { label: { _in: $predicateLabels } } } }
    }
    order_by: { created_at: desc }
    limit: $limit
    offset: $offset
  ) {
    term_id
    account_id
    created_at
    term {
      triple {
        term_id
        object_id
        object {
          ...TrendingObjectKey
        }
      }
    }
  }
}

# What the ranking needs to resolve a claim's object to a web key (URL or
# platform): new atoms keep the URL in value.thing.url, old ones in the label.
fragment TrendingObjectKey on atoms {
  term_id
  label
  value {
    thing {
      url
    }
  }
}

# Latest positions on claims from ANY app whose predicate is a canonical
# support-type predicate (recommends, uses, …) and whose object looks like a
# web atom: an http(s) URL in value.thing.url or the label, or an exact
# platform label. Same walk as GetTrendingPagePositions (newest first, the
# caller stops at its cutoff). The caller excludes predicates that the Sofia
# walk already covers by label, so the two walks never overlap.
query GetEcosystemPagePositions(
  $predicateIds: [String!]!
  $objectLabels: [String!]!
  $limit: Int!
  $offset: Int!
) {
  positions(
    where: {
      shares: { _gt: "0" }
      term: {
        triple: {
          predicate_id: { _in: $predicateIds }
          object: {
            _or: [
              { value: { thing: { url: { _ilike: "http%" } } } }
              { label: { _ilike: "http%" } }
              { label: { _in: $objectLabels } }
            ]
          }
        }
      }
    }
    order_by: { created_at: desc }
    limit: $limit
    offset: $offset
  ) {
    term_id
    account_id
    created_at
    term {
      triple {
        term_id
        object_id
        object {
          ...TrendingObjectKey
        }
      }
    }
  }
}

# Every page claim (Sofia predicates by label, canonical support predicates by
# id) on a set of web atoms: the ranked object atoms plus every other atom that
# stores the same URL (exact variants) or platform label, so duplicates across
# atoms and apps merge client-side. Metadata, vault totals (all curves),
# current supporters and the earliest positions ("first to signal"). The
# indexer caps a page at 100 rows: the caller pages by term_id.
query GetTrendingPageDetails(
  $objectIds: [String!]!
  $objectUrls: [String!]!
  $objectLabels: [String!]!
  $predicateLabels: [String!]!
  $predicateIds: [String!]!
  $limit: Int!
  $offset: Int!
) {
  triples(
    where: {
      _and: [
        {
          _or: [
            { predicate: { label: { _in: $predicateLabels } } }
            { predicate_id: { _in: $predicateIds } }
          ]
        }
        {
          _or: [
            { object_id: { _in: $objectIds } }
            { object: { value: { thing: { url: { _in: $objectUrls } } } } }
            { object: { label: { _in: $objectLabels } } }
          ]
        }
      ]
    }
    order_by: { term_id: asc }
    limit: $limit
    offset: $offset
  ) {
    term_id
    counter_term_id
    object_id
    subject_id
    subject {
      term_id
      label
    }
    predicate {
      term_id
      label
    }
    object {
      ...AtomMetadata
    }
    term {
      vaults {
        curve_id
        market_cap
        position_count
      }
    }
    supporters: positions(where: { shares: { _gt: "0" } }, limit: 1000) {
      account_id
    }
    firstPositions: positions(order_by: { created_at: asc }, limit: 3) {
      account_id
      created_at
      account {
        id
        label
        image
      }
    }
  }
}

# Platform ecosystem — every atom that may represent one of the platforms:
# the Sofia platform atoms themselves (term_id), atoms storing the platform's
# website (exact URL variants) and atoms with an exact platform label. The
# caller resolves each atom to a platform client-side (conservatively) and
# sums the atom's own vaults plus its support-type claims. Nested arrays are
# capped at 100 rows by the indexer. Paged by term_id.
query GetPlatformEcosystemAtoms(
  $termIds: [String!]!
  $urls: [String!]!
  $labels: [String!]!
  $predicateLabels: [String!]!
  $predicateIds: [String!]!
  $limit: Int!
  $offset: Int!
) {
  atoms(
    where: {
      _or: [
        { term_id: { _in: $termIds } }
        { value: { thing: { url: { _in: $urls } } } }
        { label: { _in: $labels } }
      ]
    }
    order_by: { term_id: asc }
    limit: $limit
    offset: $offset
  ) {
    ...TrendingObjectKey
    term {
      vaults {
        market_cap
      }
    }
    positions(where: { shares: { _gt: "0" } }, limit: 100) {
      account_id
    }
    as_object_triples(
      where: {
        _or: [
          { predicate: { label: { _in: $predicateLabels } } }
          { predicate_id: { _in: $predicateIds } }
        ]
      }
      limit: 100
    ) {
      term_id
      term {
        vaults {
          market_cap
        }
      }
      positions(where: { shares: { _gt: "0" } }, limit: 100) {
        account_id
      }
    }
  }
}

# Every active position of a wallet set (atoms AND claims, both sides of a
# claim), newest first. Positions-first on purpose: filtering `triples` by a
# nested `positions` / `counter_positions` _or is ~10x slower on the indexer.
# A CounterTriple term still resolves `term.triple`, so the oppose side comes
# with its claim. Value / change are computed per curve client-side (shares
# are curve-local). The indexer caps a page at 100 rows.
query GetUserMarketPositions(
  $addresses: [String!]!
  $limit: Int!
  $offset: Int!
) {
  positions(
    where: { account_id: { _in: $addresses }, shares: { _gt: "0" } }
    order_by: { created_at: desc }
    limit: $limit
    offset: $offset
  ) {
    term_id
    curve_id
    shares
    total_deposit_assets_after_total_fees
    total_redeem_assets_for_receiver
    created_at
    vault {
      current_share_price
      market_cap
      position_count
    }
    term {
      type
      atom {
        term_id
        label
        image
        value {
          thing {
            url
            name
          }
        }
      }
      triple {
        term_id
        counter_term_id
        subject {
          term_id
          label
        }
        predicate {
          term_id
          label
        }
        object {
          term_id
          label
          image
          value {
            thing {
              url
              name
            }
          }
        }
      }
    }
  }
}

# Positions chart — a wallet's daily position changes (shares and TRUST in/out
# per vault and day), oldest first. Replayed client-side into cumulative
# shares per vault. Pass the exact casings (checksummed + lowercase) with
# `_in`: `_ilike` scans this view (12s vs 0.3s a page).
query GetUserPositionHistory(
  $addresses: [String!]!
  $limit: Int!
  $offset: Int!
) {
  position_change_daily(
    where: { account_id: { _in: $addresses } }
    order_by: [{ bucket: asc }, { term_id: asc }, { curve_id: asc }]
    limit: $limit
    offset: $offset
  ) {
    bucket
    term_id
    curve_id
    assets_in_period
    assets_out_period
    shares_delta_period
  }
}

# Positions chart — daily closing share price of a set of vaults. Only days
# with a price change have a row: the caller carries the last price forward
# (and uses a vault's first `first_share_price` before its first row).
# The indexer keeps this history from 2026-02-16 on.
query GetVaultPriceHistory($termIds: [String!]!, $limit: Int!, $offset: Int!) {
  share_price_change_stats_daily(
    where: { term_id: { _in: $termIds } }
    order_by: [{ term_id: asc }, { curve_id: asc }, { bucket: asc }]
    limit: $limit
    offset: $offset
  ) {
    bucket
    term_id
    curve_id
    first_share_price
    last_share_price
  }
}

# Extension Page tab — the page's market in one call (ONE_MARKET_PER_PAGE_SPEC
# §4.2). `claims`: every page claim on the page's atoms (the `recommends`
# market and legacy ones) with both sides' vaults, the ordered stakers (rank,
# momentum) and the viewer's own legs (value / P&L). `tags`: the `in context
# of` tags hanging off those claims, with how many hold each.
query GetPageMarket(
  $objectIds: [String!]!
  $predicateLabels: [String!]!
  $accounts: [String!]!
) {
  claims: triples(
    where: {
      object_id: { _in: $objectIds }
      predicate: { label: { _in: $predicateLabels } }
    }
    limit: 50
  ) {
    term_id
    counter_term_id
    subject_id
    predicate {
      label
    }
    term {
      vaults {
        curve_id
        total_assets
        position_count
        current_share_price
      }
    }
    counter_term {
      vaults {
        curve_id
        total_assets
        position_count
        current_share_price
      }
    }
    supporters: positions(
      where: { shares: { _gt: "0" } }
      order_by: { created_at: asc }
      limit: 500
    ) {
      account_id
      created_at
    }
    opposers: counter_positions(
      where: { shares: { _gt: "0" } }
      order_by: { created_at: asc }
      limit: 500
    ) {
      account_id
      created_at
    }
    mySupport: positions(
      where: { account_id: { _in: $accounts }, shares: { _gt: "0" } }
    ) {
      curve_id
      shares
      total_deposit_assets_after_total_fees
      total_redeem_assets_for_receiver
    }
    myOppose: counter_positions(
      where: { account_id: { _in: $accounts }, shares: { _gt: "0" } }
    ) {
      curve_id
      shares
      total_deposit_assets_after_total_fees
      total_redeem_assets_for_receiver
    }
  }
  tags: triples(
    where: {
      predicate: { label: { _eq: "in context of" } }
      subject_term: {
        triple: {
          object_id: { _in: $objectIds }
          predicate: { label: { _in: $predicateLabels } }
        }
      }
    }
    limit: 100
  ) {
    subject_id
    object {
      term_id
      label
    }
    positions_aggregate(where: { shares: { _gt: "0" } }) {
      aggregate {
        count
      }
    }
  }
}

# My positions — page claims the wallet exited recently (legacy migration
# resume): if a migration stopped half-way, the exited pages can still be
# queued as Recommends. `assets` is what the wallet received (fees out).
# The indexer caps a page at 100 rows: callers page with $offset.
query GetUserRecentPageExits(
  $addresses: [String!]!
  $since: timestamptz!
  $predicateLabels: [String!]!
  $limit: Int!
  $offset: Int!
) {
  redemptions(
    where: {
      sender_id: { _in: $addresses }
      created_at: { _gte: $since }
      term: { triple: { predicate: { label: { _in: $predicateLabels } } } }
    }
    order_by: { created_at: desc }
    limit: $limit
    offset: $offset
  ) {
    assets
    created_at
    term_id
    term {
      triple {
        term_id
        predicate {
          label
        }
        object {
          term_id
          label
          value {
            thing {
              url
              name
            }
          }
        }
      }
    }
  }
}

# Pages the wallet still backs through the given page claims (a Recommend or
# a legacy claim), paged — the resume card never re-queues them.
query GetUserHeldPageClaims(
  $addresses: [String!]!
  $predicateLabels: [String!]!
  $limit: Int!
  $offset: Int!
) {
  positions(
    where: {
      account_id: { _in: $addresses }
      shares: { _gt: "0" }
      term: { triple: { predicate: { label: { _in: $predicateLabels } } } }
    }
    order_by: { created_at: desc }
    limit: $limit
    offset: $offset
  ) {
    term {
      triple {
        object_id
      }
    }
  }
}
