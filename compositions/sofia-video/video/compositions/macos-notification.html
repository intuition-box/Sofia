<!-- hyperframes-registry-item: macos-notification -->
<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        background: transparent;
        overflow: hidden;
      }
      body {
        width: 1776px;
        height: 890px;
        font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Inter", sans-serif;
      }

      [data-composition-id="macos-notification"] .notification-card {
        position: absolute;
        top: 28px;
        right: 28px;
        width: 420px;
        background: rgba(28, 28, 30, 0.82);
        backdrop-filter: blur(40px);
        -webkit-backdrop-filter: blur(40px);
        border-radius: 18px;
        padding: 16px 18px;
        box-shadow:
          0 12px 36px rgba(0, 0, 0, 0.45),
          inset 0 0 0 0.5px rgba(255, 255, 255, 0.12);
        display: flex;
        gap: 14px;
        align-items: flex-start;
      }

      [data-composition-id="macos-notification"] .app-icon {
        width: 38px;
        height: 38px;
        border-radius: 9px;
        flex-shrink: 0;
        overflow: hidden;
      }

      [data-composition-id="macos-notification"] .app-icon svg {
        width: 38px;
        height: 38px;
        display: block;
      }

      [data-composition-id="macos-notification"] .notification-content {
        flex: 1;
        min-width: 0;
      }

      [data-composition-id="macos-notification"] .notification-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 3px;
      }

      [data-composition-id="macos-notification"] .app-name {
        font-size: 12.5px;
        font-weight: 600;
        color: rgba(255, 255, 255, 0.55);
        text-transform: uppercase;
        letter-spacing: 0.04em;
      }

      [data-composition-id="macos-notification"] .time-label {
        font-size: 12.5px;
        font-weight: 400;
        color: rgba(255, 255, 255, 0.4);
      }

      [data-composition-id="macos-notification"] .notification-title {
        font-size: 15.5px;
        font-weight: 600;
        color: #ffffff;
        line-height: 1.3;
        margin-bottom: 2px;
        letter-spacing: -0.005em;
      }

      [data-composition-id="macos-notification"] .notification-body {
        font-size: 13px;
        font-weight: 400;
        color: rgba(255, 255, 255, 0.62);
        line-height: 1.35;
      }

      [data-composition-id="macos-notification"] .trust-amount {
        color: #ff8a3d;
        font-weight: 600;
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="macos-notification"
      data-width="1776"
      data-height="890"
      data-start="0"
      data-duration="2.6"
    >
      <div
        id="notification"
        class="clip notification-card"
        data-start="0"
        data-duration="2.6"
        data-track-index="0"
      >
        <div class="app-icon">
          <!-- Ambire-style favicon: deep ink + signature orange A mark -->
          <svg viewBox="0 0 38 38" fill="none" xmlns="http://www.w3.org/2000/svg">
            <defs>
              <linearGradient id="ambire-bg" x1="0" y1="0" x2="38" y2="38" gradientUnits="userSpaceOnUse">
                <stop offset="0%" stop-color="#1a1f3a" />
                <stop offset="100%" stop-color="#0b0e1f" />
              </linearGradient>
              <linearGradient id="ambire-a" x1="0" y1="0" x2="0" y2="38" gradientUnits="userSpaceOnUse">
                <stop offset="0%" stop-color="#ff8a3d" />
                <stop offset="100%" stop-color="#ff5e1f" />
              </linearGradient>
            </defs>
            <rect width="38" height="38" rx="9" fill="url(#ambire-bg)" />
            <path d="M19 8 L29 28 L25.2 28 L23.4 24.3 L14.6 24.3 L12.8 28 L9 28 Z M19 14.4 L16.2 21 L21.8 21 Z" fill="url(#ambire-a)" />
          </svg>
        </div>
        <div class="notification-content">
          <div class="notification-header">
            <span class="app-name">Ambire Wallet</span>
            <span class="time-label">now</span>
          </div>
          <div class="notification-title">alice.eth spent <span class="trust-amount">10 TRUST</span></div>
          <div class="notification-body">Reinforced your post on Sofia · r/Thailand itinerary</div>
        </div>
      </div>
    </div>

    <script>
      window.__timelines = window.__timelines || {};

      (function () {
        const tl = gsap.timeline({ paused: true });
        const notification = document.getElementById("notification");

        // Start off-screen to the right + faint blur
        gsap.set(notification, { x: 460, opacity: 0, filter: "blur(8px)" });

        // Slide-in with snap
        tl.to(notification, {
          x: 0,
          opacity: 1,
          filter: "blur(0px)",
          duration: 0.55,
          ease: "expo.out",
        }, 0.10);

        // Subtle settle — small bounce-back
        tl.fromTo(notification,
          { scale: 1 },
          { scale: 1.015, duration: 0.10, ease: "power2.out", yoyo: true, repeat: 1 },
          0.55);

        // Slide-out to the right
        tl.to(notification, {
          x: 460,
          opacity: 0,
          filter: "blur(6px)",
          duration: 0.40,
          ease: "power3.in",
        }, 2.15);

        window.__timelines["macos-notification"] = tl;
      })();
    </script>
  </body>
</html>
